name: Flash Product Release Notes
scheme: >-
  Per-product release trains published as dated help-center articles. Server-side
  products (Digital, Core Platform, Parkonect Cloud) are versioned by deployment DATE
  on a roughly two-week cadence; installed/on-prem products (Flash PARCS, Flash Valet,
  Parkonect Firmware) carry four-part dotted version numbers. There is no single
  platform version and no API-specific changelog - API changes are announced inside
  the product release notes that contain them.
