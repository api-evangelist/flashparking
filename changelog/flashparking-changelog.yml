  highlights:
  - Customer Service API Ticket Search now accepts External ID as a searchable parameter
  - Enterprise SSO for Flash PARCS admin portal non-Valet roles
  - Revenue reports extended to the Tender Retail payment gateway
  - Fixes to monthly account status transitions, Monthly Pool calculation and Validation
