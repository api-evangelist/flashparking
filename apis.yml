x-artifacts-without-pointers:
  note: >-
    These artifacts exist in the repo but deliberately carry NO common[] pointer,
    because each records a measured ABSENCE and a pointer would assert the provider
    serves a surface it does not.
  files:
  - path: well-known/flashparking-well-known.yml
    reason: every /.well-known/ path 404s on Flash-controlled hosts; the one 200 is
      Atlassian's security.txt on the vendor-hosted status page, not Flash's
  - path: rate-limits/flashparking-rate-limits.yml
    reason: limit_count 0 - no published limits, no headers, no observable endpoint
  - path: packages/flashparking-packages.yml
    reason: package_count 0 - no first-party SDK in any registry
  - path: plans/flashparking-plans-pricing.yml
    reason: plan_count 0 - three pricing models named, no tiers, prices or quotas published
