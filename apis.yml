apis:
- aid: flashparking:flash-platform-apis
  name: Flash Platform Partner APIs
  description: 'The nine partner APIs Flash publishes for Flash PARCS and Flash Valet:
    eParking (inject and manage parking reservations), Locations (real-time occupancy,
    garage status and active pricing), Monthly (monthly parker lifecycle), Validations
    (search validations and apply discounts), Customer Service (call-center ticket
    search, gate vending, refunds, video call a lane), Price Manager (check, adjust
    and schedule parking rates), FlashPass (purchase and manage passes), Vehicle
    Request (submit valet retrieval requests) and Flash Receipt (pull transaction
    receipts). Documented by capability only - Flash publishes no base URL, no
    authentication model and no OpenAPI/Swagger definition; sandbox certification and
    production access are sold through sales@flashparking.com.'
  humanURL: https://help.flashos.com/support/solutions/articles/60001639636-api-integrations-with-flash-parcs-and-flash-valet
