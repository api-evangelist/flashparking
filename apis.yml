aid: flashparking
name: Flashparking
description: 'Flash (formerly FlashParking) is an Austin, Texas parking technology
  company that sells an end-to-end mobility platform to parking asset owners and
  operators: cloud software (FlashOS), purpose-built PARCS gate and kiosk hardware,
  Flash Vision LPR/computer-vision cameras, valet and enforcement applications, EV
  charging, accounts-receivable automation, and a consumer Demand Network reached
  through its ParkWhiz/Arrive brands. Flash publishes a named catalog of nine
  partner APIs for Flash PARCS and Flash Valet - eParking, Locations, Monthly,
  Validations, Customer Service, Price Manager, FlashPass, Vehicle Request and Flash
  Receipt - used by partners including Ticketmaster, SpotHero, LAZ Parking, Genea and
  Daktronics. Those APIs are commercially gated: the help center documents what each
  API does but publishes no base URL, no authentication model and no machine-readable
  specification, and sandbox certification plus production access carry monthly fees
  arranged through sales@flashparking.com.'
